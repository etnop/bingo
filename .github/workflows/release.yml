name: release

# push de uma tag v* (ex.: git tag v1.0.0 && git push origin v1.0.0)
# gera Bingo-x86_64.AppImage (Linux) e o instalador Bingo-2.0.0.exe (Windows) e publica a release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - run: chmod +x mvnw package.sh && WIN_JDK=/none ./package.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/Bingo-x86_64.AppImage }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - name: WiX (usado pelo jpackage para o instalador)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
      - name: build
        shell: pwsh
        run: |
          ./mvnw.cmd -q -DskipTests package
          New-Item -ItemType Directory -Force jp-in, dist | Out-Null
          Copy-Item target/Bingo-2.0.0.jar jp-in/bingo.jar
          # instalador: instala uma vez, atalho no menu Iniciar e no ambiente de trabalho
          jpackage --type exe --name Bingo --app-version 2.0.0 --vendor "Pedro Ponte" `
            --input jp-in --main-jar bingo.jar --dest dist `
            --icon src/main/resources/icon.ico `
            --win-menu --win-shortcut --win-dir-chooser `
            --win-upgrade-uuid 6f1c2a4e-9b7d-4c3e-8a51-2d0f6e9b7c11 `
            --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,java.scripting,java.instrument,java.prefs,jdk.unsupported,jdk.crypto.ec `
            --jlink-options "--strip-debug --no-man-pages --no-header-files" `
            --java-options "--enable-native-access=ALL-UNNAMED"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/Bingo-2.0.0.exe }

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/Bingo-x86_64.AppImage
            dist/Bingo-2.0.0.exe
          generate_release_notes: true
