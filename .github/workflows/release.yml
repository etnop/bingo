name: release

# push de uma tag v* (ex.: git tag v1.0.0 && git push origin v1.0.0)
# gera Bingo-x86_64.AppImage (Linux) e Bingo.exe (Windows) e publica a release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - run: chmod +x mvnw package.sh && WIN_JDK=/none ./package.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/Bingo-x86_64.AppImage }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - name: build
        shell: pwsh
        run: |
          ./mvnw.cmd -q -DskipTests package
          New-Item -ItemType Directory -Force jp-in, dist | Out-Null
          Copy-Item target/Bingo-2.0.0.jar jp-in/bingo.jar
          jpackage --type app-image --name Bingo --input jp-in --main-jar bingo.jar --app-version 2.0.0 --dest jp-out --java-options "--enable-native-access=ALL-UNNAMED"
          # junta a pasta num único Bingo.exe (extrai-se sozinho na 1ª execução)
          Invoke-WebRequest https://github.com/dgiagio/warp/releases/download/v0.3.0/windows-x64.warp-packer.exe -OutFile warp-packer.exe
          ./warp-packer.exe --arch windows-x64 --input_dir jp-out/Bingo --exec Bingo.exe --output dist/Bingo.exe
          # o runner do warp é de consola: marca o .exe como GUI para não abrir janela preta
          # (= editbin /SUBSYSTEM:WINDOWS; campo Subsystem no cabeçalho PE, 2 = GUI)
          python -c "import struct;p='dist/Bingo.exe';b=bytearray(open(p,'rb').read());pe=struct.unpack_from('<I',b,0x3C)[0];struct.pack_into('<H',b,pe+0x5C,2);open(p,'wb').write(b)"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/Bingo.exe }

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/Bingo-x86_64.AppImage
            dist/Bingo.exe
          generate_release_notes: true
